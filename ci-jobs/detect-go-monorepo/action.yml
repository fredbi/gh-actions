name: detect-go-monorepo
description: |
  Detects if a golang git repo is a mono-repo with multiple modules
  and outputs the list of modules with their location with various
  formats (JSON, bash-compatible list).

  Requires: go setup, git checkout

author: go-openapi

outputs:
  is-monorepo:
    description: |
      Indicates if the current repo is a go mono repo.
    value: ${{ steps.detect-monorepo.outputs.is-monorepo }}

  modules-count:
    description: |
      Counts how many modules have been detected.
    value: ${{ steps.detect-monorepo.outputs.modules-count }}

  modules:
    description: |
      A JSON array of modules with name (go import path) and path (folder in the current checkout).
    value: ${{ steps.detect-monorepo.outputs.modules }}

  paths:
    description: |
      A JSON array of modules paths
    value: ${{ steps.detect-monorepo.outputs.paths }}

  relative-names:
    description: |
      A JSON array of modules relative module names (relative imports).
      The root module always yields an empty string.
      These are pure relative paths without leading "." or "/".

      Example: github.com/go-openapi/swag/jsonutils yields "jsonutils"
    value: ${{ steps.detect-monorepo.outputs.relative-names }}

  bash-paths:
    description: |
      A bash-compatible array of modules paths.

      The bash-compatible list is a list of blank separated, unquoted strings.
      It is exposed to classical shell-escaping issues, but reads nicely into a bash array like so:

      mapfile -d' ' -t ALL_FOLDERS < <(printf "%s" "DOLLAR{{ bash-paths }}") # bash 4 syntax

    value: ${{ steps.detect-monorepo.outputs.bash-paths }}

  bash-subpaths:
    description: |
      A bash-compatible array of modules relative paths with the "/..." suffix.

      There a relative paths to module folders like "./...", "./jsonutils/...".

      The bash-compatible list is a list of blank separated, unquoted strings.
      It is exposed to classical shell-escaping issues.

    value: ${{ steps.detect-monorepo.outputs.bash-subpaths }}

  bash-relative-names:
    description: |
      A bash-compatible array of modules relative names (relative imports).
      The root module always yields the string '{root}'.

      These are pure relative paths without leading "." or "/".

      Example: github.com/go-openapi/swag/jsonutils yields "jsonutils"

      The bash-compatible list is a list of blank separated, unquoted strings.
      It is exposed to classical shell-escaping issues.

    value: ${{ steps.detect-monorepo.outputs.bash-relative-names }}

  names:
    description: |
      A JSON array of modules names (import paths)
    value: ${{ steps.detect-monorepo.outputs.names }}

  root-module:
    description: |
      The name (go import path) of the root module in the go mono repo.
    value: ${{ steps.detect-monorepo.outputs.root-module }}

runs:
  using: composite
  steps:
    -
      name: Detect modules
      id: detect-monorepo
      shell: bash
      run: |
        # Use go-monorepo-detector binary (replaces 55 lines of bash+jq)
        go-monorepo-detector -format github-actions >> "${GITHUB_OUTPUT}"

        # Output notices for visibility
        while IFS='=' read -r key value; do
          echo "::notice title=${key}::${value}"
        done < "${GITHUB_OUTPUT}"

branding:
  icon: 'key'
  color: 'green'
