name: go-mod-version installer
description: |
  Download the latest vetted version of go-mod-version.

  github.com/go-openapi/gh-actions/cmd/go-mod-version@{version}

author: go-openapi

inputs:
  version:
    description: |
      State explicitly the version to be downloaded.

      By default the "auto" value uses the versions configured in go.mod
    required: false
    default: auto

outputs:
  version:
    description: The version of the tool that has been installed
    value: ${{ steps.resolve-version.outputs.version }}

runs:
  using: composite
  steps:
    -
      name: Check if runner is supported
      if: >-
        ${{
          (runner.os != 'Linux' && runner.os != 'macOS' && runner.os != 'Windows') ||
          (runner.arch != 'X64' && runner.arch != 'ARM64')
        }}
      shell: bash
      run: |
          echo "::error::installation not supported for ${{ runner.os }} on ${{ runner.arch }}"
          echo "::error::please build locally with go or see available artifacts at https://github.com/go-openapi/gh-actions/releases"
          exit 1
    -
      name: Resolve version
      id: resolve-version
      shell: bash
      env:
        TOOL: go-mod-version
        VERSION_RESOLVER: '${{ github.action_path }}/../../get-tool-version.sh'
      run: |
        if [[ '${{ !inputs.version }}' == 'true' || '${{ inputs.version }}' == 'auto' ]] ; then
          # Bootstrap: use get-tool-version.sh for initial releases
          # Once go-mod-version is in PATH, it can resolve its own version
          if command -v go-mod-version &> /dev/null ; then
            VERSION=$(go-mod-version -tool "${TOOL}")
          else
            VERSION=$("${VERSION_RESOLVER}" "${TOOL}")
          fi
        else
          VERSION='${{ inputs.version }}'
        fi

        if [[ -z "${VERSION}" ]] ; then
          echo "::error::Could not resolve version for tool ${TOOL}"
          exit 1
        fi

        echo "::notice title=Version:${VERSION}"
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
    -
      name: Install go-mod-version
      shell: bash
      env:
        REPO: go-openapi/gh-actions
        DOWNLOAD_DIR: ${{ runner.temp }}/downloads
        TARGET_DIR: ${{ github.action_path }}/bin
        TOOL: go-mod-version
        VERSION: ${{ steps.resolve-version.outputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        OS=$(echo '${{ runner.os }}'|tr '[A-Z]' '[a-z]'|sed 's/macos/darwin/')
        ARCH=$(echo '${{ runner.arch }}'|tr '[A-Z]' '[a-z]'|sed 's/x64/amd64/')

        mkdir -p "${DOWNLOAD_DIR}"

        ARCHIVE_FORMAT=".tar.gz"
        gh release download "${VERSION}" \
          --repo "${REPO}" \
          --pattern "go-mod-version_*_${OS}_${ARCH}${ARCHIVE_FORMAT}" \
          --output "${DOWNLOAD_DIR}"/"artifact${ARCHIVE_FORMAT}"

        if [[ "${OS}" == "windows" ]] ; then
          TOOL="${TOOL}.exe"
        fi
        (cd "${DOWNLOAD_DIR}" && tar xf "artifact${ARCHIVE_FORMAT}" "${TOOL}" && rm -f "artifact${ARCHIVE_FORMAT}")

        mkdir -p "${TARGET_DIR}"
        mv "${DOWNLOAD_DIR}"/"${TOOL}" "${TARGET_DIR}"

        echo '${{ github.action_path }}/bin' >> "$GITHUB_PATH"

branding:
  icon: 'package'
  color: 'blue'
